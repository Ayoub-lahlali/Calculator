<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    
    <div class="container">
        <input class="displayArea" readonly >
        <div class="keys">
            <button onclick="clearArea()">C</button>
            <button onclick="deleteOne()">DEL</button>
            <button onclick="addToDisplayArea('%')">%</button>
            <button onclick="addToDisplayArea('/')" class="SpecialBtn">/</button>
            <button onclick="addToDisplayArea('7')">7</button>
            <button onclick="addToDisplayArea('8')">8</button>
            <button onclick="addToDisplayArea('9')">9</button>
            <button onclick="addToDisplayArea('*')" class="SpecialBtn">X</button>
            <button onclick="addToDisplayArea('4')">4</button>
            <button onclick="addToDisplayArea('5')">5</button>
            <button onclick="addToDisplayArea('6')">6</button>
            <button onclick="addToDisplayArea('-')" class="SpecialBtn">-</button>
            <button onclick="addToDisplayArea('1')">1</button>
            <button onclick="addToDisplayArea('2')">2</button>
            <button onclick="addToDisplayArea('3')">3</button>
            <button onclick="addToDisplayArea('+')" class="SpecialBtn">+</button>
            <button onclick="addToDisplayArea('.')">.</button>
            <button onclick="addToDisplayArea('0')">0</button>
            <button onclick="calculate()" class="equal SpecialBtn">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
